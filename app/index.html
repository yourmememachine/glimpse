<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Glimpse</title>
<style>
  body { background:#111; color:#ddd; font-family: system-ui, sans-serif; margin:16px; }
  #preview { width:576px; height:288px; max-width:100%; background:#000; color:#39ff6a;
    font-family: ui-monospace, monospace; padding:12px; box-sizing:border-box; overflow:hidden;
    white-space:pre-wrap; line-height:1.5; border:1px solid #333; }
  #preview .title { font-weight:bold; border-bottom:1px solid #1d5c2e; margin-bottom:8px; }
  section { margin-top:20px; max-width:576px; }
  input { font-size:20px; letter-spacing:4px; width:160px; }
</style>
</head>
<body>
<div id="preview"><div class="title">Glimpse</div><div id="preview-lines">Loading…</div></div>
<p style="max-width:576px">Dev preview (browser fallback): Arrow keys scroll, Enter = tap, Esc = back, L = long press. On the glasses the same screens run through the Even Hub SDK.</p>
<section id="pairing">
  <h2>Pair Glimpse</h2>
  <p>Message the Telegram bot with /start to get a 6-digit code, then enter it here.</p>
  <input id="pair-code" inputmode="numeric" maxlength="6" placeholder="000000" />
  <button id="pair-btn">Pair</button>
  <span id="pair-status"></span>
</section>
<script type="module" src="./src/main.js"></script>
</body>
</html>
